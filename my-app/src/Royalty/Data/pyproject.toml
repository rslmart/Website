[project]
name = "royaltree-pipeline"
version = "0.1.0"
description = "Data pipeline for the makoa.link RoyalTree page (Wikipedia/Wikidata -> public/royalty/)."
requires-python = ">=3.11"
dependencies = [
    # Wikipedia scraping + Wikidata API (stages 1-4)
    "requests==2.32.5",
    "beautifulsoup4==4.14.3",
    # buildMonarchImages.py: thumbnail re-encoding (Pillow) and S3 upload (boto3)
    "pillow>=13.0",
    "boto3>=1.44",
]

[tool.uv]
package = false
