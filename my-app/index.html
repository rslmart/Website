<!DOCTYPE html>

    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#166534" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0B" media="(prefers-color-scheme: dark)" />
    <script>
      /* Theme before first paint (no flash of the wrong theme). Mirrors
         src/hooks/useTheme.js: keep the storage key and the light-only
         list in sync (a test checks them). */
      (function () {
        var lightOnly = [];
        var theme = null;
        try { theme = localStorage.getItem("theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (lightOnly.indexOf(location.pathname.toLowerCase().replace(/\/+$/, "")) !== -1) theme = "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
