<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#166534" />
    <meta name="theme-color" content="#0B0B0B" media="(prefers-color-scheme: dark)" />
    <script>
      /* Theme before first paint (no flash of the wrong theme). Mirrors
         src/hooks/useTheme.js: keep the storage key and the light-only
         list in sync (a test checks them). */
      (function () {
        var lightOnly = ["/bio", "/hurricane", "/royaltree", "/snow", "/tectonics"];
        var theme = null;
        try { theme = localStorage.getItem("theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (lightOnly.indexOf(location.pathname.toLowerCase().replace(/\/+$/, "")) !== -1) theme = "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <meta
      name="description"
      content="Makoa's Website for personal projects."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/android-chrome-192x192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Makoa's Website</title>
  <script type="module" src="src/index"></script></head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
